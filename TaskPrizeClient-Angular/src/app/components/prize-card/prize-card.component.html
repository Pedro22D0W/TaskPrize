<div class="brutalist-card">
  <div class="brutalist-card__header">
    <div class="brutalist-card__alert">{{prize?.title}}</div>
    <span class="brutalist-card__alert">{{prize?.cost}} $</span>
  </div>

  <div class="brutalist-card__message">
    {{prize?.description}}
  </div>

  <div class="footer">
    <a size="small" class="brutalist-card__button brutalist-card__button--mark" (click)="rescuePrize(prize)">RESGATAR</a>
    <div class="edit-delete_container">
      
        <img src="../../assets/icon/lixeira.png" alt="deletar" width="30" height="30" (click)="deletePrize()" />
        <img src="../../assets/icon/editar.png" alt="editar" width="30" height="30"  (click)="editPrize(prize)" />
     
    </div>
  </div>
</div>
