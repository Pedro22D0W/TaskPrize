<div class="task-card">
  <div class="header">
    <div class="title">{{task?.title}}</div>
    <span class="reward">{{task?.payment}} $</span>

  </div>
  

  <div class="description">
    {{task?.description}}
  </div>

  <div class="footer">
    <ion-button size="small" class="progress-button" (click)="regProgress()">REGISTRAR PROGRESSO</ion-button>
    <span class="progress">{{task?.current_progress}}/{{task.progress}}</span>
    
  </div>
</div>
