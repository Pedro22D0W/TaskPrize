<div class="brutalist-card">
  <div class="brutalist-card__header">
    <div class="brutalist-card__alert">{{task?.title}}</div>
    <span class="brutalist-card__alert">{{task?.payment}} $</span>

  </div>
  

  <div class="brutalist-card__message">
    {{task?.description}}
  </div>

  <div class="footer">
    <a size="small" class="brutalist-card__button brutalist-card__button--mark" (click)="onClick(task.taskId)">PROGREDIR {{task?.current_progress}}/{{task.progress}}</a>
   
    
  </div>
</div>
