<ion-content class="ion-padding cadastro-content" scroll-y="true" fullscreen="true">
  <div class="container">
    <app-form-box>

      <app-input-component [label]="'Nome'" [type]="'text'" [(model)]="name"></app-input-component>
      <app-input-component [label]="'Email'" [type]="'email'" [(model)]="email"></app-input-component>
      <app-input-component [label]="'Senha'" [type]="'password'" [(model)]="password"></app-input-component>

      <div class="buttons">
        <ion-button expand="block" (click)="signup()">CADASTRAR</ion-button>
      </div>
    </app-form-box>
  </div>
</ion-content>
