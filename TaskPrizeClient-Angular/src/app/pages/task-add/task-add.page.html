<ion-content class="ion-padding cadastro-content" scroll-y="true" fullscreen="true">
  <div class="container">
    <app-form-box>

      <app-input-component [label]="'Titulo'" [type]="'text'" [(model)]="title"></app-input-component>
      <app-input-component [label]="'Descrição'" [type]="'text'" [(model)]="description"></app-input-component>
      <app-input-component [label]="'Etapas'" [type]="'number'" [(model)]="progress"></app-input-component>
      <app-input-component [label]="'Valor'" [type]="'number'" [(model)]="payment"></app-input-component>
      <app-input-component [label]="'status'" [type]="'boolean'" [(model)]="status"></app-input-component>

      <div class="buttons">
        <ion-button expand="block" (click)="addTask()">ADICIONAR TASK</ion-button>
      </div>
    </app-form-box>
  </div>
</ion-content>
