<ion-content [fullscreen]="true" class="container">
  <div class="home-container">

    <div class="header">
      <div id="saldo">SALDO : {{user.balance}}</div>
      <div id="loja">
        <ion-button fill="clear">
          <img src="../../assets/icon/cifrao.png" alt="loja" width="45" height="45" />
        </ion-button>
      </div>
    </div>

    
    <div class="cards-scroll-wrapper">
        <div class="cards-container">
          <app-task-card *ngFor="let task of tasks" [task]="task"></app-task-card>
        </div>
    </div>

    
    <ion-button class="add-button" (click)="addTask()">+</ion-button>

  </div>
</ion-content>
